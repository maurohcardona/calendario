services:

  web:
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py collectstatic --noinput &&
             uv run waitress-serve --host=0.0.0.0 --port=8000 Agenda.wsgi:application"
    volumes:
      - static_volume:/app/staticfiles_collected
    restart: always
    environment:
      DEBUG: "0"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles_collected:ro
    depends_on:
      - web

volumes:
  static_volume: